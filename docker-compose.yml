services:
  db:
    image: postgres:16
    container_name: gymlog_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - gymlog_data:/var/lib/postgresql/data

volumes:
  gymlog_data: